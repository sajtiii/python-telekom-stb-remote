name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import smoke test
        run: python -c "from telekom_remote import Remote, Device, Key, Epg, Channel, Program, ChannelGroup; print('import OK')"
      - name: Offline regression test (byte-exact crypto vs captured pairing)
        run: python tests/test_capture.py
      - name: Syntax check (all modules + examples)
        run: python -m compileall -q src/telekom_remote examples tests

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  build:
    name: build + wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel and import subpackages
        run: |
          pip install dist/*.whl
          python -c "from telekom_remote.types.epg import Channel, Program, ChannelGroup; from telekom_remote.utils import localname; print('wheel OK — subpackages present')"
